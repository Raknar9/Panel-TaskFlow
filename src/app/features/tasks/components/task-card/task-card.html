<div
  class="border dark:border-zinc-700 rounded-xl p-4 bg-white dark:bg-zinc-800 flex flex-col md:flex-row md:items-center md:justify-between gap-3 transition-all duration-300"
>

  <!-- TEXTO -->
  <div class="flex-1">
    <h3
      class="font-semibold text-base md:text-lg dark:text-white"
      [class.line-through]="task.completed"
      [class.text-gray-400]="task.completed"
    >
      {{ task.title }}
    </h3>

    <p
      class="text-sm md:text-base text-gray-500 dark:text-gray-300"
      [class.line-through]="task.completed"
    >
      {{ task.description }}
    </p>
  </div>

  <!-- ACCIONES -->
  <div class="flex flex-wrap items-center gap-2 md:gap-3">

    <button
      (click)="toggle.emit(task.id)"
      class="px-3 py-2 text-xs md:text-sm rounded-xl bg-green-100 text-green-700"
    >
      {{ task.completed ? 'OK' : 'Completar' }}
    </button>

    <button
      (click)="delete.emit(task.id)"
      class="px-3 py-2 text-xs md:text-sm rounded-xl bg-red-100 text-red-700"
    >
      Eliminar
    </button>

    <span
      class="px-3 py-1 text-xs md:text-sm rounded-full"
      [class]="
        task.priority === 'Alta'
          ? 'bg-red-100 text-red-700'
          : task.priority === 'Media'
          ? 'bg-yellow-100 text-yellow-700'
          : 'bg-green-100 text-green-700'
      "
    >
      {{ task.priority }}
    </span>

  </div>

</div>
