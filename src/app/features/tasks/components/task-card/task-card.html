<div
  class="border dark:border-zinc-700 rounded-xl p-4 flex justify-between items-center bg-white dark:bg-zinc-800 hover:scale-[1.01] hover:shadow-xl transition-all duration-300"
>

  <div>

    <h3
      class="font-semibold text-lg dark:text-white"
      [class.line-through]="task.completed"
      [class.text-gray-400]="task.completed"
    >
      {{ task.title }}
    </h3>

    <p
      class="text-gray-500 dark:text-gray-300"
      [class.line-through]="task.completed"
    >
      {{ task.description }}
    </p>

  </div>

  <div class="flex items-center gap-3">

    <button
      (click)="toggle.emit(task.id)"
      class="px-4 py-2 rounded-xl text-sm bg-green-100 text-green-700 hover:opacity-80 hover:scale-105 transition-all duration-300"
    >
      {{ task.completed ? 'Completada' : 'Completar' }}
    </button>

    <button
      (click)="delete.emit(task.id)"
      class="px-4 py-2 rounded-xl text-sm bg-red-100 text-red-700 hover:opacity-80 hover:scale-105 transition-all duration-300"
    >
      Eliminar
    </button>

    <span
      class="px-3 py-1 rounded-full text-sm"
      [class]="
        task.priority === 'Alta'
          ? 'bg-red-100 text-red-700'
          : task.priority === 'Media'
          ? 'bg-yellow-100 text-yellow-700'
          : 'bg-green-100 text-green-700'
      "
    >
      {{ task.priority }}
    </span>

  </div>

</div>
