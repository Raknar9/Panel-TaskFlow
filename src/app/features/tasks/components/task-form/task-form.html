<div class="grid md:grid-cols-3 gap-4 mb-8">

  <input
    type="text"
    placeholder="Título de la tarea"
    [(ngModel)]="title"
    class="border rounded-xl p-3 outline-none focus:ring-2 focus:ring-black"
  />

  <input
    type="text"
    placeholder="Descripción"
    [(ngModel)]="description"
    class="border rounded-xl p-3 outline-none focus:ring-2 focus:ring-black"
  />

  <select
    [(ngModel)]="priority"
    class="border rounded-xl p-3 outline-none focus:ring-2 focus:ring-black"
  >
    <option value="Baja">Baja</option>
    <option value="Media">Media</option>
    <option value="Alta">Alta</option>
  </select>

</div>

<button
  (click)="addTask()"
  class="bg-black text-white px-5 py-3 rounded-xl mb-8 hover:opacity-90 transition"
>
  Crear tarea
</button>
