<div class="grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-4 mb-6 md:mb-8">

  <input
    type="text"
    placeholder="Título"
    [(ngModel)]="title"
    class="border rounded-xl p-3 w-full"
  />

  <input
    type="text"
    placeholder="Descripción"
    [(ngModel)]="description"
    class="border rounded-xl p-3 w-full"
  />

  <select
    [(ngModel)]="priority"
    class="border rounded-xl p-3 w-full"
  >
    <option value="Baja">Baja</option>
    <option value="Media">Media</option>
    <option value="Alta">Alta</option>
  </select>

</div>

<button
  (click)="addTask()"
  class="bg-black text-white w-full md:w-auto px-5 py-3 rounded-xl mb-6 md:mb-8"
>
  Crear tarea
</button>
