<div class="min-h-screen bg-gray-100 dark:bg-zinc-900 p-4 md:p-10 transition-colors duration-300">

  <div class="max-w-5xl mx-auto">

    <h1 class="text-3xl md:text-5xl font-bold mb-6 md:mb-8 text-gray-800 dark:text-white">
      Panel de TaskFlow
    </h1>

    <!-- STATS -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-6 md:mb-8">

      <div class="bg-white dark:bg-zinc-800 rounded-2xl shadow-lg p-4 md:p-6">
        <p class="text-xs md:text-sm text-gray-500 dark:text-gray-300">
          Total
        </p>
        <h2 class="text-xl md:text-3xl font-bold mt-2">
          {{ totalTasks() }}
        </h2>
      </div>

      <div class="bg-white dark:bg-zinc-800 rounded-2xl shadow-lg p-4 md:p-6">
        <p class="text-xs md:text-sm text-gray-500 dark:text-gray-300">
          Completadas
        </p>
        <h2 class="text-xl md:text-3xl font-bold mt-2 text-green-600">
          {{ completedTasks() }}
        </h2>
      </div>

      <div class="bg-white dark:bg-zinc-800 rounded-2xl shadow-lg p-4 md:p-6">
        <p class="text-xs md:text-sm text-gray-500 dark:text-gray-300">
          Pendientes
        </p>
        <h2 class="text-xl md:text-3xl font-bold mt-2 text-yellow-600">
          {{ pendingTasks() }}
        </h2>
      </div>

      <div class="bg-white dark:bg-zinc-800 rounded-2xl shadow-lg p-4 md:p-6">
        <p class="text-xs md:text-sm text-gray-500 dark:text-gray-300">
          Alta
        </p>
        <h2 class="text-xl md:text-3xl font-bold mt-2 text-red-600">
          {{ highPriorityTasks() }}
        </h2>
      </div>

    </div>

    <!-- PANEL -->
    <div class="bg-white dark:bg-zinc-800 rounded-2xl shadow-lg p-4 md:p-6">

      <h2 class="text-xl md:text-2xl font-semibold mb-4 md:mb-6">
        Mis Tareas
      </h2>

      <app-task-form (create)="createTask($event)" />

      <!-- SEARCH -->
      <div class="flex flex-col gap-3 md:flex-row md:gap-4 mb-6">

        <input
          type="text"
          placeholder="Buscar tarea..."
          [value]="searchTerm()"
          (input)="searchTerm.set($any($event.target).value)"
          class="border dark:border-zinc-700 dark:bg-zinc-900 dark:text-white rounded-xl p-3 w-full"
        />

        <div class="flex flex-wrap gap-2">
          <button (click)="filter.set('Todas')" class="btn-filter">Todas</button>
          <button (click)="filter.set('Pendientes')" class="btn-filter">Pendientes</button>
          <button (click)="filter.set('Completadas')" class="btn-filter">Completadas</button>
        </div>

      </div>

      <!-- TASKS -->
      <div class="space-y-3 md:space-y-4">
        @for(task of filteredTasks(); track task.id) {
          <app-task-card
            [task]="task"
            (delete)="deleteTask($event)"
            (toggle)="toggleCompleted($event)"
          />
        }
      </div>

    </div>

  </div>
</div>
